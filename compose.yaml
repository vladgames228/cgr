services:
  bot:
    build:
      context: .
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - data:/data
    restart: unless-stopped
    init: true
    cpus: 2.0
    mem_limit: 2g
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
